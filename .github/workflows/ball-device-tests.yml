name: Ball device regression tests

on:
  pull_request:
    paths:
      - 'scripts/src/**'
      - 'scripts/tests/**'
      - '.github/workflows/ball-device-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ball-device:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run VBScript regression scenarios
        shell: pwsh
        run: |
          $output = & cscript.exe //nologo scripts\tests\ball-device-tests.vbs 2>&1
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Output $_ }
          if ($exitCode -ne 0 -or -not ($output | Select-String -Pattern '^\d+ scenarios; \d+ assertions; 0 failures\.$' -Quiet)) {
            throw 'VBScript regression runner failed or did not reach its final summary.'
          }
